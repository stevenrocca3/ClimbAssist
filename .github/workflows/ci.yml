name: CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  application-server:
    name: Application server build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install server and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Run server tests
        run: python -m unittest discover -s tests -v

  web-client:
    name: Web client test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Run hold parser tests
        run: npm test
      - name: Build web client
        run: npm run build
